<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error Monitor SDK 靶场</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
      }
      h1 {
        color: #333;
      }
      .btn-group {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
        margin-top: 20px;
      }
      button {
        padding: 12px 20px;
        font-size: 14px;
        cursor: pointer;
        background-color: #f0f0f0;
        border: 1px solid #ccc;
        border-radius: 6px;
        transition: all 0.2s;
      }
      button:hover {
        background-color: #e0e0e0;
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(1px);
      }
      .danger {
        color: #d32f2f;
        border-color: #d32f2f;
        background-color: #ffebee;
      }
      .danger:hover {
        background-color: #ffcdd2;
      }
    </style>
  </head>
  <body>
    <h1>🎯 Error Monitor SDK 靶场</h1>
    <p>点击下方按钮触发错误，观察<b>终端控制台</b>的报错输出。</p>

    <div class="btn-group">
      <button class="danger" id="btn-js">💥 触发 JS 运行时错误</button>
      <button class="danger" id="btn-promise">💥 触发 Promise Reject</button>
      <button class="danger" id="btn-xhr">💥 触发 XHR 请求失败</button>
      <button class="danger" id="btn-fetch">💥 触发 Fetch 请求失败</button>
      <button class="danger" id="btn-resource">💥 触发 资源加载失败 (404)</button>
      <button class="danger" id="btn-vue">💥 触发 Vue 组件错误</button>
      <button class="danger" id="btn-react">💥 触发 React 组件错误</button>
    </div>

    <div
      id="vue-app"
      style="margin-top: 20px; border: 1px dashed #42b983; padding: 10px; display: none"
    >
      <h3>Vue 3 测试区域</h3>
      <p>{{ message }}</p>
      <button @click="triggerError">在 Vue 中触发错误</button>
    </div>

    <div
      id="react-app"
      style="margin-top: 20px; border: 1px dashed #61dafb; padding: 10px; display: none"
    ></div>

    <!-- 引入 SDK (本地打包版本) -->
    <script src="../dist/index.umd.js"></script>

    <!-- 引入框架依赖 (使用国内镜像加速) -->
    <!-- Vue 3 -->
    <script src="https://npm.elemecdn.com/vue@3/dist/vue.global.js"></script>
    <!-- React 18 & ReactDOM 18 -->
    <script crossorigin src="https://npm.elemecdn.com/react@18/umd/react.development.js"></script>
    <script
      crossorigin
      src="https://npm.elemecdn.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <script>
      /**
       * =========================================================================
       *  SDK 初始化配置
       * =========================================================================
       * 在 UMD 模式下，SDK 会挂载到全局变量 window.ErrorMonitor
       * (该变量名在 rollup.config.js 的 output.name 中配置)
       */
      console.log('正在初始化 SDK (CDN 模式)...', ErrorMonitor)

      // 手动初始化全局监控 (捕获 JS/网络/资源错误)
      // 注意：如果是 Vue/React 场景，通常由插件或辅助函数自动调用，
      // 这里显式调用是为了演示基础功能的独立使用。
      ErrorMonitor.initErrorMonitor({
        reportUrl: 'http://localhost:3000/error-report',
        projectName: 'Test-Playground-Global',
        environment: 'dev'
      })

      /**
       * =========================================================================
       *  基础错误测试用例
       * =========================================================================
       */

      // 1. JS 运行时错误 (ReferenceError)
      // 预期：捕获到 'JavaScript Error'，包含堆栈信息
      document.getElementById('btn-js').onclick = () => {
        const obj = {}
        console.log(obj.notExist.func()) // 典型空指针错误
      }

      // 2. Promise 未捕获异常 (Unhandled Rejection)
      // 预期：捕获到 'Unhandled Promise Rejection'
      document.getElementById('btn-promise').onclick = () => {
        Promise.reject(new Error('这是一个未捕获的 Promise 错误！'))
      }

      // 3. XHR 请求错误 (Network Error)
      // 预期：捕获到 'Network Error'，记录请求方法和 URL
      document.getElementById('btn-xhr').onclick = () => {
        const xhr = new XMLHttpRequest()
        xhr.open('GET', 'http://localhost:9999/not-exist') // 端口不存在导致连接失败
        xhr.send()
      }

      // 4. Fetch 请求错误 (Fetch Error)
      // 预期：捕获到 'Fetch Error'
      document.getElementById('btn-fetch').onclick = () => {
        fetch('http://localhost:9999/not-exist') // 端口不存在
      }

      // 5. 资源加载错误 (Resource Load Error)
      // 预期：捕获到 'Resource Load Error'，且不冒泡到 window.onerror
      document.getElementById('btn-resource').onclick = () => {
        const img = document.createElement('img')
        img.src = '/404-image.png' // 图片资源不存在
        document.body.appendChild(img)
        // 稍后移除 DOM 元素以免影响页面美观
        setTimeout(() => document.body.removeChild(img), 100)
      }

      /**
       * =========================================================================
       *  框架集成测试用例 (Vue / React)
       * =========================================================================
       */

      // 6. Vue 3 组件错误测试
      // 原理：通过 app.config.errorHandler 全局捕获
      document.getElementById('btn-vue').onclick = () => {
        const vueContainer = document.getElementById('vue-app')
        vueContainer.style.display = 'block'

        // 避免重复创建 Vue 实例
        if (vueContainer.__vue_app__) return

        const app = Vue.createApp({
          data() {
            return { message: 'Hello Vue 3!' }
          },
          methods: {
            triggerError() {
              throw new Error('这是 Vue 组件内部触发的错误！')
            }
          }
        })

        // 核心：安装监控插件 (一行代码接入)
        app.use(ErrorMonitor.VueErrorMonitorPlugin, {
          reportUrl: 'http://localhost:3000/error-report',
          projectName: 'Test-Playground-Vue',
          environment: 'dev'
        })

        app.mount('#vue-app')
        vueContainer.__vue_app__ = app
      }

      // 7. React 18 组件错误测试
      // 原理：通过 Error Boundary 包裹组件树捕获
      document.getElementById('btn-react').onclick = () => {
        const reactContainer = document.getElementById('react-app')
        reactContainer.style.display = 'block'

        // 避免重复挂载
        if (reactContainer._isMounted) return

        // --- 定义一个会崩溃的子组件 ---
        const BuggyComponent = () => {
          const [hasError, setHasError] = React.useState(false)
          if (hasError) {
            throw new Error('这是 React 组件内部触发的错误！')
          }
          return React.createElement(
            'button',
            { onClick: () => setHasError(true) },
            '在 React 中触发错误'
          )
        }

        // --- 定义根组件 ---
        const App = () => {
          return React.createElement(
            'div',
            null,
            React.createElement('h3', null, 'React 测试区域'),
            React.createElement(BuggyComponent)
          )
        }

        // 核心：创建监控专用的 Error Boundary (自动初始化全局监控)
        const ErrorBoundary = ErrorMonitor.createReactErrorBoundary(React, {
          reportUrl: 'http://localhost:3000/error-report',
          projectName: 'Test-Playground-React',
          environment: 'dev'
        })

        // 渲染：用 ErrorBoundary 包裹整个 App
        const root = ReactDOM.createRoot(reactContainer)
        root.render(
          React.createElement(
            ErrorBoundary,
            {
              fallback: React.createElement(
                'h3',
                { style: { color: 'red' } },
                'React 组件崩溃了！已捕获。'
              )
            },
            React.createElement(App)
          )
        )
        reactContainer._isMounted = true
      }
    </script>
  </body>
</html>

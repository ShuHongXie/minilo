# web-server.conf
# Nginx 配置文件，用于实现 IP 白名单和静态文件服务

# 定义 IP 白名单
geo $allowed_ip {
    default 0;
    127.0.0.1 1; # 本地开发环境
    192.168.1.100 1; # 构建服务器 IP（替换为实际的构建服务器 IP）
    # 可以添加更多 IP 地址
}

# HTTP 服务器配置
server {
    listen 80;
    server_name localhost;

    # 静态文件服务
    location /static {
        alias D:\xsh\minilo\apps\server\public; # 静态文件目录
        expires 30d; # 缓存时间
        add_header Cache-Control "public, max-age=2592000";
    }

    # 健康检查路由
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # 需要 IP 白名单保护的接口
    location /api/mapping {
        # 检查 IP 是否在白名单中
        if ($allowed_ip = 0) {
            return 403 'Forbidden: IP not allowed';
        }

        # 反向代理到后端服务
        proxy_pass http://localhost:3000; # 假设后端服务运行在 3000 端口
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 处理 OPTIONS 请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        # 添加 CORS 头
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }

    # 其他 API 路由
    location /api {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 配置
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }

    # 404 处理
    error_page 404 /404.html;
    location = /404.html {
        root D:\xsh\minilo\apps\server\public;
        internal;
    }

    # 500 处理
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root D:\xsh\minilo\apps\server\public;
        internal;
    }
}

# HTTPS 服务器配置（可选）
